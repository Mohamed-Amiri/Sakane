spring.application.name=LocaSpace

# ===============================
# Database
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/locaspace;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# ===============================
# H2 Console (local development)
# ===============================
spring.h2.console.enabled=true

# Run data.sql AFTER Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===============================
# JWT
# ===============================
jwt.secret=locaspaceSecretKeyForJWTTokenGeneration2024SecureKey
jwt.expiration=86400000

# ===============================
# Server
# ===============================
server.port=${PORT:8082}

# ===============================
# File upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads