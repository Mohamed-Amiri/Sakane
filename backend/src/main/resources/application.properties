spring.application.name=LocaSpace

# ===============================
# Database
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/locaspace;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=3

# ===============================
# JPA / Hibernate
# ===============================
# Populated databases must be migrated explicitly (see db/migration/{h2,mysql}).
# Keep `validate` here so Hibernate never attempts to alter populated tables on
# startup. For a brand-new, empty development database you may bootstrap it once
# with SPRING_JPA_HIBERNATE_DDL_AUTO=update (or create), then switch back to
# validate.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# ===============================
# Startup / initialization
# ===============================
spring.main.lazy-initialization=true
# Run data.sql AFTER Hibernate creates the schema when seeding is explicitly enabled.
spring.jpa.defer-datasource-initialization=true
# For local demo data, set SPRING_SQL_INIT_MODE=always.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# ===============================
# H2 Console (local development)
# ===============================
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sakane.vercel.app,http://localhost:4200}

# ===============================
# JWT
# ===============================
jwt.secret=locaspaceSecretKeyForJWTTokenGeneration2024SecureKey
jwt.expiration=86400000

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

# ===============================
# File upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads
