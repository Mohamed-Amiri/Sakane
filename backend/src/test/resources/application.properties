spring.application.name=LocaSpace

# In-memory H2 for tests only (never touches backend/data/locaspace.mv.db).
spring.datasource.url=jdbc:h2:mem:sakane_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=locaspaceSecretKeyForJWTTokenGeneration2024SecureKey
jwt.expiration=86400000

file.upload-dir=target/test-uploads
